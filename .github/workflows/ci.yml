name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32c6
